name: Publish macOS Dev Build

on:
  push:
    branches:
      - quick-terminal-tabs
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: dev-macos-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-and-publish:
    name: Build, test, and publish Apple Silicon
    runs-on: xcode-27
    timeout-minutes: 60
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Zig
        uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
        with:
          version: 0.17.1

      - name: Set up Nushell
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/nushell"
          curl --fail --location --silent --show-error \
            https://github.com/nushell/nushell/releases/download/0.117.0/nu-0.117.0-aarch64-apple-darwin.tar.gz \
            -o "$RUNNER_TEMP/nushell.tar.gz"
          echo "1d0e642ef3bff22113a82749a0fa24a0126f4fea0db46a5909e56e94a4b57527  $RUNNER_TEMP/nushell.tar.gz" | shasum -a 256 -c
          tar -xf "$RUNNER_TEMP/nushell.tar.gz" -C "$RUNNER_TEMP/nushell"
          echo "$RUNNER_TEMP/nushell/nu-0.117.0-aarch64-apple-darwin" >> "$GITHUB_PATH"

      - name: Ensure Metal compiler is available
        shell: bash
        run: |
          set -euo pipefail
          if ! xcrun -sdk macosx metal --version >/dev/null 2>&1; then
            xcodebuild -downloadComponent MetalToolchain
          fi

      - name: Build Ghostty core
        run: zig build -Demit-macos-app=false -Dxcframework-target=native

      - name: Resolve Swift packages without Keychain prompts
        run: xcodebuild -resolvePackageDependencies -project macos/Ghostty.xcodeproj -scheme Ghostty -packageAuthorizationProvider netrc

      - name: Build macOS app
        run: nu macos/build.nu --configuration Debug --action build

      - name: Run macOS tests
        run: nu macos/build.nu --configuration Debug --action test

      - name: Package app
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist/staging
          ditto macos/build/Debug/Ghostty.app 'dist/staging/Ghostty Dev.app'
          ditto -c -k --sequesterRsrc --keepParent 'dist/staging/Ghostty Dev.app' dist/Ghostty-Dev-macos-arm64.zip
          (cd dist && shasum -a 256 Ghostty-Dev-macos-arm64.zip > SHA256SUMS)

      - name: Upload workflow artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: Ghostty-Dev-macos-arm64
          path: |
            dist/Ghostty-Dev-macos-arm64.zip
            dist/SHA256SUMS
          if-no-files-found: error

      - name: Publish development release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          short_sha="${GITHUB_SHA:0:12}"
          tag="dev-${short_sha}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          cat > "$RUNNER_TEMP/release-notes.md" <<NOTES
          Development build for commit ${GITHUB_SHA}.

          - macOS on Apple Silicon (arm64).
          - Debug build with a separate bundle ID; this is not a notarized release.
          - To open it for the first time, use Finder's Open action and follow macOS prompts if necessary.
          - CI run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}
          NOTES
          gh release create "$tag" dist/Ghostty-Dev-macos-arm64.zip dist/SHA256SUMS \
            --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --title "Ghostty Dev ${short_sha}" --notes-file "$RUNNER_TEMP/release-notes.md" \
            --prerelease
