name: Publish Fork macOS Build

on:
  push:
    branches:
      - dev
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: fork-macos-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-and-publish:
    name: Build, test, and publish Apple Silicon
    if: github.repository == 'thongntit/ghostty' && (github.ref == 'refs/heads/dev' || github.ref == 'refs/heads/main')
    runs-on: xcode-27
    timeout-minutes: 60
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Zig
        uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
        with:
          version: 0.17.1

      - name: Set up Nushell
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/nushell"
          curl --fail --location --silent --show-error \
            https://github.com/nushell/nushell/releases/download/0.117.0/nu-0.117.0-aarch64-apple-darwin.tar.gz \
            -o "$RUNNER_TEMP/nushell.tar.gz"
          echo "1d0e642ef3bff22113a82749a0fa24a0126f4fea0db46a5909e56e94a4b57527  $RUNNER_TEMP/nushell.tar.gz" | shasum -a 256 -c
          tar -xf "$RUNNER_TEMP/nushell.tar.gz" -C "$RUNNER_TEMP/nushell"
          echo "$RUNNER_TEMP/nushell/nu-0.117.0-aarch64-apple-darwin" >> "$GITHUB_PATH"

      - name: Ensure Metal compiler is available
        shell: bash
        run: |
          set -euo pipefail
          if ! xcrun -sdk macosx metal --version >/dev/null 2>&1; then
            xcodebuild -downloadComponent MetalToolchain
          fi

      - name: Select build configuration
        shell: bash
        run: |
          if [[ "$GITHUB_REF_NAME" == main ]]; then
            echo "BUILD_CONFIGURATION=ReleaseLocal" >> "$GITHUB_ENV"
            echo "BUILD_OPTIMIZATION=ReleaseFast" >> "$GITHUB_ENV"
            echo "APP_NAME=Ghostty Fork" >> "$GITHUB_ENV"
            echo "ASSET=Ghostty-macos-arm64.zip" >> "$GITHUB_ENV"
            echo "BUNDLE_ID=io.github.thongntit.ghostty" >> "$GITHUB_ENV"
          else
            echo "BUILD_CONFIGURATION=Debug" >> "$GITHUB_ENV"
            echo "BUILD_OPTIMIZATION=Debug" >> "$GITHUB_ENV"
            echo "APP_NAME=Ghostty Dev" >> "$GITHUB_ENV"
            echo "ASSET=Ghostty-Dev-macos-arm64.zip" >> "$GITHUB_ENV"
            echo "BUNDLE_ID=com.mitchellh.ghostty.debug" >> "$GITHUB_ENV"
          fi

      - name: Build Ghostty core
        run: zig build -Demit-macos-app=false -Dxcframework-target=native -Doptimize="$BUILD_OPTIMIZATION"

      - name: Resolve Swift packages without Keychain prompts
        run: xcodebuild -resolvePackageDependencies -project macos/Ghostty.xcodeproj -scheme Ghostty -packageAuthorizationProvider netrc

      - name: Build macOS app
        run: nu macos/build.nu --configuration "$BUILD_CONFIGURATION" --action build

      - name: Run macOS tests
        run: nu macos/build.nu --configuration Debug --action test

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: settings/go.mod
          cache-dependency-path: settings/go.sum

      - name: Package app
        shell: bash
        run: |
          set -euo pipefail
          app="macos/build/$BUILD_CONFIGURATION/Ghostty.app"
          actual_id=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$app/Contents/Info.plist")
          test "$actual_id" = "$BUNDLE_ID"
          test "$(lipo -archs "$app/Contents/MacOS/ghostty")" = arm64
          codesign --verify --deep --strict "$app"
          mkdir -p dist/staging
          ditto "$app" "dist/staging/$APP_NAME.app"
          sh macos/bundle-settings.sh "dist/staging/$APP_NAME.app"
          ditto -c -k --sequesterRsrc --keepParent "dist/staging/$APP_NAME.app" "dist/$ASSET"
          (cd dist && shasum -a 256 "$ASSET" > SHA256SUMS)

      - name: Upload workflow artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: Ghostty-${{ github.ref_name }}-macos-arm64
          path: |
            dist/*.zip
            dist/SHA256SUMS
          if-no-files-found: error

      - name: Publish GitHub release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          short_sha="${GITHUB_SHA:0:12}"
          flags=(--prerelease --latest=false)
          tag_prefix=dev
          if [[ "$GITHUB_REF_NAME" == main ]]; then
            flags=(--latest)
            tag_prefix=release
          fi
          tag="$tag_prefix-$short_sha-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          cat > "$RUNNER_TEMP/release-notes.md" <<NOTES
          Ghostty fork build from ${GITHUB_REF_NAME} at commit ${GITHUB_SHA}.

          - macOS on Apple Silicon (arm64).
          - ${APP_NAME}.app uses its own bundle identifier and ad-hoc signing.
          - This build has not been notarized by Apple.
          - CI run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}
          NOTES
          gh release create "$tag" "dist/$ASSET" dist/SHA256SUMS \
            --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --title "$APP_NAME $short_sha" --notes-file "$RUNNER_TEMP/release-notes.md" \
            "${flags[@]}"
